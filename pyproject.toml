[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytide-clock"
version = "0.1.0"
description = "Fullscreen tide clock using XTide predictions and pygame-ce"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.5.0",
]

[project.scripts]
pytide = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
